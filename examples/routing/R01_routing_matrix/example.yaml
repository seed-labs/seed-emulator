id: routing-r01-routing-matrix
name: Routing Matrix Regression
description: Exercises major iBGP designs across BIRD, FRR, and mixed backends.
runner: internet
script: routing_matrix.py
platform: amd
features:
  - routing-regression
  - ebgp-private-peering
  - ibgp-full-mesh
  - ibgp-route-reflector
  - ibgp-auto-complete
  - bird
  - frr
  - ospf

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 1200

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: routing matrix services are running
      type: compose-ps
      services:
        - brdnode_2_edge0
        - rnode_2_core0
        - rnode_2_core1
        - brdnode_2_edge1
        - brdnode_3_edge0
        - rnode_3_core0
        - rnode_3_core1
        - brdnode_3_edge1
        - brdnode_4_edge0
        - rnode_4_core0
        - brdnode_5_edge0
        - rnode_5_core0
        - brdnode_6_edge0
        - rnode_6_core0
        - brdnode_7_edge0
        - rnode_7_core0
        - hnode_150_host_0
        - hnode_151_host_0
        - hnode_152_host_0
        - hnode_153_host_0
        - hnode_154_host_0
        - hnode_155_host_0
        - hnode_156_host_0
        - hnode_157_host_0
        - hnode_158_host_0
        - hnode_159_host_0
      retries: 40
      interval: 3

probes:
  - name: AS150 reaches AS151 through AS2 BIRD full mesh
    type: ping
    service: hnode_150_host_0
    target: 10.151.0.71
    count: 3
    retries: 30
    interval: 5

  - name: AS152 reaches AS153 through AS3 FRR full mesh
    type: ping
    service: hnode_152_host_0
    target: 10.153.0.71
    count: 3
    retries: 30
    interval: 5

  - name: AS154 reaches AS155 through AS4 BIRD route reflector
    type: ping
    service: hnode_154_host_0
    target: 10.155.0.71
    count: 3
    retries: 30
    interval: 5

  - name: AS156 reaches AS157 through AS5 FRR route reflector
    type: ping
    service: hnode_156_host_0
    target: 10.157.0.71
    count: 3
    retries: 30
    interval: 5

  - name: AS158 reaches AS159 through AS6 auto-completed route reflector
    type: ping
    service: hnode_158_host_0
    target: 10.159.0.71
    count: 3
    retries: 30
    interval: 5

test_programs:
  - name: routing matrix runtime validation
    script: test_runtime.py
    timeout: 420
