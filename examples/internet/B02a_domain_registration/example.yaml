id: internet-b02a-tld-dns
name: Mini Internet With Hidden COM Primary
description: A B02 DNS deployment with Namingo Registrar, Registry, and hidden-primary COM DNS.
runner: internet
script: domain_registration.py
platform: amd
features:
  - ipv4-default
  - mini-internet
  - dns-component
  - dns-cache
  - hidden-primary
  - authoritative-secondary
  - tsig-zone-transfer
  - namingo-registrar
  - namingo-registry
  - epp
  - secure-zone-publication

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 900

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: Namingo, COM DNS, root, and client containers are running
      type: compose-ps
      services:
        - hnode_151_host_0
        - hnode_152_host_0
        - hnode_153_c-com
        - hnode_171_host_0
        - hnode_150_host_1
        - hnode_150_namingo-registrar
        - hnode_154_namingo-registry
      retries: 10
      interval: 3

    - name: COM-A hidden primary is ready
      type: exec
      service: hnode_151_host_0
      command: "pgrep named >/dev/null"
      expect_exit: 0
      retries: 10
      interval: 3

    - name: COM-B public secondary is ready
      type: exec
      service: hnode_152_host_0
      command: "dig @127.0.0.1 com. SOA +norecurse +short | grep -q ."
      expect_exit: 0
      retries: 10
      interval: 3

    - name: COM-C public secondary is ready
      type: exec
      service: hnode_153_c-com
      command: "dig @127.0.0.1 com. SOA +norecurse +short | grep -q ."
      expect_exit: 0
      retries: 10
      interval: 3

    - name: Namingo Registrar is ready
      type: exec
      service: hnode_150_namingo-registrar
      command: "pgrep -f start_whois.php >/dev/null && pgrep -f start_rdap.php >/dev/null && grep -q '\"status\":\"ok\"' /run/seedemu-epp-health.json"
      expect_exit: 0
      retries: 10
      interval: 3

    - name: Namingo Registry EPP is ready
      type: exec
      service: hnode_154_namingo-registry
      command: "pgrep -f start_epp.php >/dev/null"
      expect_exit: 0
      retries: 5
      interval: 3

    - name: Registry Zone Writer snapshot reached the public COM servers
      type: exec
      service: hnode_152_host_0
      command: "test \"$(dig @127.0.0.1 com. SOA +norecurse +short | awk '{print $3}')\" -gt 1"
      expect_exit: 0
      retries: 12
      interval: 3

test_programs:
  - name: B02a TLD DNS topology validation
    script: test_runtime.py
    timeout: 300
