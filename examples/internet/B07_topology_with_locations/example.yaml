id: internet-b07-topology-with-locations
name: Topology with Geographic Locations
description: A geographically labelled 150-node topology with 20 IXes, transit ASes, stub ASes, InternetMap, and Traffic Observer.
runner: internet
script: topology_with_locations.py
platform: amd
features:
  - geographic-locations
  - internet-exchanges
  - provider-customer-routing
  - internet-map
  - traffic-observer

compile:
  enabled: true
  # Exercise the script's default 150-node topology and default seed.
  env:
    PYTHONDONTWRITEBYTECODE: "1"
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
    - output/emulator_api_server.map.seed/Dockerfile
    - output/internetmap_toplogy.map.seed/Dockerfile
    - output/internetmap_geo.map.seed/Dockerfile
    - output/traffic_observer.map.seed/Dockerfile
  timeout: 1800

build:
  enabled: true
  timeout: 2400

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: Representative B07 topology and map services are running
      type: compose-ps
      services:
        - brdnode_2_r100
        - brdnode_2_r101
        - brdnode_150_router0
        - hnode_150_host_0
        - hnode_150_host_1
        - brdnode_169_router0
        - hnode_169_host_0
        - hnode_169_host_1
        - emulator_api_server.map.seed
        - internetmap_toplogy.map.seed
        - internetmap_geo.map.seed
        - traffic_observer.map.seed
      retries: 40
      interval: 3

test_programs:
  - name: B07 topology and geographic metadata runtime checks
    script: test_runtime.py
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    timeout: 900
