id: internet-b51-rip
name: OSPF and RIP Mini Internet
description: B00 topology with Rip, default OSPF, shared AS-level IGP interface policies, and mixed BIRD/FRR routing.
runner: internet
script: rip.py
platform: amd
features:
  - ipv4-default
  - mini-internet
  - ospf
  - rip
  - rip-policy-options
  - ibgp
  - ebgp-route-server
  - ebgp-private-peering
  - bird
  - frr

compile:
  enabled: true
  output: output
  args: [--backend, mixed]
  clean: [output]
  expected: [output/docker-compose.yml]
  timeout: 600

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: representative OSPF and RIP services are running
      type: compose-ps
      services:
        - brdnode_2_r100
        - brdnode_2_r101
        - brdnode_3_r103
        - brdnode_12_r104
        - hnode_150_host_0
        - hnode_152_host_0
        - hnode_160_host_0
        - hnode_171_host_0
      retries: 40
      interval: 3

probes:
  - name: AS150 reaches AS152 through RIP transit
    type: ping
    service: hnode_150_host_0
    target: 10.152.0.71
    count: 3
    retries: 40
    interval: 3
  - name: AS150 reaches AS160 through FRR OSPF transit
    type: ping
    service: hnode_150_host_0
    target: 10.160.0.71
    count: 3
    retries: 40
    interval: 3
  - name: AS171 reaches AS154 customized host
    type: ping
    service: hnode_171_host_0
    target: 10.154.0.129
    count: 3
    retries: 40
    interval: 3

test_programs:
  - name: OSPF RIP BGP and all-interface ping on all discovered nodes
    script: test_runtime.py
    timeout: 420
