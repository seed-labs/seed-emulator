id: yesterday-y13-botnet-dos-attack
name: Botnet Denial-of-Service Attack
description: B00 mini-Internet topology with a BotnetLab controller, distributed bots, and victim-impact visualization.
runner: internet
script: emulator.py
platform: amd
features:
  - mini-internet
  - botnet
  - botnet-lab
  - command-and-control
  - udp-denial-of-service
  - traffic-visualization
  - victim-health-probe

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 600

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: Y13 controller and victim-impact services are running
      type: compose-ps
      services:
        - hnode_150_bot-controller
        - hnode_151_host_0
        - hnode_153_host_0
        - brdnode_151_router0
      retries: 40
      interval: 3

probes:
  - name: BotnetLab controller is healthy
    type: exec
    service: hnode_150_bot-controller
    command: python3 -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200"
    expect_exit: 0
    retries: 30
    interval: 2

  - name: traffic visualizer is healthy
    type: exec
    service: hnode_151_host_0
    command: python3 -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz').status == 200"
    expect_exit: 0
    retries: 30
    interval: 2

test_programs:
  - name: Y13 botnet DoS runtime validation
    script: test_runtime.py
    timeout: 900
