id: yesterday-y11-smurf-attack
name: Smurf and Fraggle Attacks
description: B00 mini-Internet topology with a vulnerable directed-broadcast LAN for ICMP and UDP amplification.
runner: internet
script: emulator.py
platform: amd
features:
  - mini-internet
  - directed-broadcast
  - icmp-broadcast-reply
  - spoofed-icmp
  - udp-broadcast-reply
  - spoofed-udp

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 600

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: Y11 representative services are running
      type: compose-ps
      services:
        - hnode_150_host_0
        - hnode_151_host_0
        - hnode_152_host_0
        - hnode_152_host_11
        - brdnode_151_router0
        - brdnode_152_router0
        - brdnode_2_r101
        - brdnode_12_r101
      retries: 40
      interval: 3

probes:
  - name: attacker reaches the victim across the mini Internet
    type: ping
    service: hnode_150_host_0
    target: 10.151.0.71
    count: 3
    retries: 40
    interval: 5

  - name: attacker reaches the vulnerable AS152 LAN
    type: ping
    service: hnode_150_host_0
    target: 10.152.0.71
    count: 3
    retries: 40
    interval: 5

test_programs:
  - name: Y11 Smurf and Fraggle runtime validation
    script: test_runtime.py
    timeout: 300
