id: yesterday-y10-ntp-amplification
name: NTP-Like Amplification
description: B00 mini-Internet topology with lab-only NTP-like amplifiers and an attack trigger.
runner: internet
script: emulator.py
platform: amd
features:
  - mini-internet
  - udp-amplification
  - ntp-like-monitor-response
  - reflection-simulation

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 600

build:
  enabled: true
  timeout: 1800

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: Y10 representative services are running
      type: compose-ps
      services:
        - hnode_150_host_0
        - hnode_151_host_0
        - hnode_153_host_0
        - brdnode_151_router0
        - hnode_152_host_0
        - hnode_160_host_0
        - hnode_171_host_0
        - brdnode_2_r100
        - brdnode_3_r103
        - brdnode_11_r102
      retries: 40
      interval: 3

probes:
  - name: attacker reaches the victim across the mini Internet
    type: ping
    service: hnode_150_host_0
    target: 10.151.0.71
    count: 3
    retries: 40
    interval: 5

  - name: attacker reaches an NTP-like amplifier
    type: ping
    service: hnode_150_host_0
    target: 10.152.0.71
    count: 3
    retries: 40
    interval: 5

test_programs:
  - name: Y10 NTP-like amplification runtime validation
    script: test_runtime.py
    timeout: 300
